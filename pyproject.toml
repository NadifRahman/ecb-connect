[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecbe-connect"
version = "0.1.1"
description = "Unofficial TMU ECBE SSH and VNC connection helper"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ECBE Connect contributors" }]
dependencies = [
  "asyncssh==2.24.0",
  "keyring==25.7.0",
  "platformdirs==4.11.12",
  "PySide6==6.11.2",
  "rich==15.0.0",
  "typer==0.27.2",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pyinstaller==6.22.3",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-qt==4.5.0",
  "ruff==0.16.9",
]

[project.scripts]
ecbe-connect = "ecbe_connect.cli.app:run"
ecbe-connect-gui = "ecbe_connect.gui.app:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ecbe_connect"]

[tool.bandit]
exclude_dirs = ["tests"]
